services:
  - type: web
    name: el6-electrode-ml
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: el6-electrode-db
          property: connectionString

databases:
  - name: el6-electrode-db
    plan: free
    region: frankfurt
